<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperCore Dashboard</title>
  <style>
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 18px;
    }
    p.sub {
      margin: 0 0 16px 0;
      color: #888;
      font-size: 13px;
    }
    .box {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #262626;
      font-size: 13px;
    }
    .row:last-child {
      border-bottom: none;
    }
    .lbl {
      color: #999;
    }
    .val {
      font-weight: bold;
    }
    .status-on { color: #4caf50; }
    .status-off { color: #f44336; }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    button {
      flex: 1;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #3a3a3a;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:active {
      background: #3a3a3a;
    }
    button.active {
      background: #3f51b5;
      border-color: #3f51b5;
    }
    #msg {
      font-size: 12px;
      color: #81c784;
      margin-bottom: 10px;
      display: none;
    }
    pre {
      background: #0a0a0a;
      border: 1px solid #222;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #aaa;
      margin: 6px 0 0 0;
    }
  </style>
</head>
<body>

  <h2>Tanzanite HyperCore</h2>
  <p class="sub">Kernel Tuner for MediaTek Helio G99 Ultra</p>

  <div class="box">
    <div class="row">
      <span class="lbl">Daemon Status</span>
      <span class="val status-on" id="st_daemon">Checking...</span>
    </div>
    <div class="row">
      <span class="lbl">Active Profile</span>
      <span class="val" id="st_profile">-</span>
    </div>
    <div class="row">
      <span class="lbl">Governor Mode</span>
      <span class="val" id="st_mode">Auto</span>
    </div>
    <div class="row">
      <span class="lbl">Little Cores (CPU 0-5)</span>
      <span class="val" id="st_cpulow">-</span>
    </div>
    <div class="row">
      <span class="lbl">Big Cores (CPU 6-7)</span>
      <span class="val" id="st_cpuhigh">-</span>
    </div>
    <div class="row">
      <span class="lbl">GPU Load</span>
      <span class="val" id="st_gpu">-</span>
    </div>
    <div class="row">
      <span class="lbl">CPU / Battery Temp</span>
      <span class="val" id="st_temp">-</span>
    </div>
  </div>

  <div class="btn-group">
    <button id="btn_mode" onclick="toggleGamingLock()">Lock Gaming</button>
    <button onclick="flushRam()">Flush RAM</button>
    <button onclick="restartDaemon()">Restart</button>
  </div>

  <div id="msg"></div>

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span style="font-size:12px; color:#888;">Daemon Logs</span>
    <a href="#" onclick="refreshData(); return false;" style="font-size:12px; color:#7986cb; text-decoration:none;">Refresh</a>
  </div>
  <pre id="log_box">Loading logs...</pre>

  <script>
    var isGamingLocked = false;

    function runShell(cmd) {
      return new Promise(function(resolve, reject) {
        if (typeof ksu !== "undefined" && typeof ksu.exec === "function") {
          var cb = "cb_" + Date.now();
          window[cb] = function(code, stdout, stderr) {
            delete window[cb];
            resolve(stdout || stderr || "");
          };
          ksu.exec(cmd, "{}", cb);
        } else if (typeof exec === "function") {
          exec(cmd).then(function(res) {
            resolve(typeof res === "object" ? (res.stdout || res.stderr || "") : String(res));
          }).catch(reject);
        } else {
          reject("Manager interface not found");
        }
      });
    }

    function showMsg(text) {
      var el = document.getElementById("msg");
      el.innerText = text;
      el.style.display = "block";
      setTimeout(function() { el.style.display = "none"; }, 3000);
    }

    function toggleGamingLock() {
      var cmd = isGamingLocked
        ? "rm -f /data/adb/modules/tanzanite_hypercore/.hypercore_lock /sdcard/Android/.hypercore_lock; echo 'Mode: Auto'"
        : "echo GAMING > /data/adb/modules/tanzanite_hypercore/.hypercore_lock; echo GAMING > /sdcard/Android/.hypercore_lock; echo 'Mode: Gaming Locked'";

      runShell(cmd).then(function(out) {
        showMsg(out.trim());
        refreshData();
      });
    }

    function flushRam() {
      runShell("sync; echo 3 > /proc/sys/vm/drop_caches; echo 1 > /proc/sys/vm/compact_memory; echo 'RAM and ZRAM flushed'").then(function(out) {
        showMsg(out.trim());
      });
    }

    function restartDaemon() {
      runShell("pkill -9 -x hypercore 2>/dev/null; sleep 1; /data/adb/modules/tanzanite_hypercore/hypercore; echo 'Daemon restarted'").then(function(out) {
        showMsg(out.trim());
        refreshData();
      });
    }

    function refreshData() {
      var cmd = [
        'pgrep -x "hypercore" >/dev/null && echo "RUNNING" || echo "STOPPED"',
        'cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null || echo 0',
        'cat /sys/devices/system/cpu/cpu6/cpufreq/scaling_cur_freq 2>/dev/null || echo 0',
        'cat /sys/module/ged/parameters/gpu_loading 2>/dev/null || echo 0',
        'cat /sys/class/thermal/thermal_zone16/temp 2>/dev/null || cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || echo 0',
        'cat /sys/class/power_supply/battery/temp 2>/dev/null || echo 0',
        '([ -f /data/adb/modules/tanzanite_hypercore/.hypercore_lock ] || [ -f /sdcard/Android/.hypercore_lock ]) && echo "GAMING" || echo "AUTO"'
      ].join('; echo "---"; ');

      runShell(cmd).then(function(res) {
        var parts = res.trim().split('---');
        if (parts.length >= 7) {
          var running = parts[0].trim() === "RUNNING";
          var dEl = document.getElementById("st_daemon");
          dEl.innerText = running ? "Running" : "Stopped";
          dEl.className = "val " + (running ? "status-on" : "status-off");

          document.getElementById("st_cpulow").innerText = (parseInt(parts[1].trim()) / 1000) + " MHz";
          document.getElementById("st_cpuhigh").innerText = (parseInt(parts[2].trim()) / 1000) + " MHz";
          document.getElementById("st_gpu").innerText = parts[3].trim() + "%";
          document.getElementById("st_temp").innerText = (parseInt(parts[4].trim()) / 1000) + "°C / " + (parseInt(parts[5].trim()) / 10) + "°C";

          isGamingLocked = (parts[6].trim() === "GAMING");
          document.getElementById("st_mode").innerText = isGamingLocked ? "Gaming Lock" : "Auto";
          var btn = document.getElementById("btn_mode");
          btn.innerText = isGamingLocked ? "Unlock Auto" : "Lock Gaming";
          btn.className = isGamingLocked ? "active" : "";
        }
      });

      runShell("tail -n 20 /sdcard/Android/hypercore.log 2>/dev/null").then(function(log) {
        if (log) {
          document.getElementById("log_box").innerText = log.trim();
          var lines = log.trim().split('\n');
          var last = lines[lines.length - 1];
          if (last && last.indexOf("Profile:") !== -1) {
            var p = last.split("Profile:")[1].trim().split(" ")[0];
            document.getElementById("st_profile").innerText = p;
          }
        }
      });
    }

    setInterval(refreshData, 3000);
    refreshData();
  </script>
</body>
</html>
